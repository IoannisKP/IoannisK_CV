<!doctype html>
<html lang="en" data-type="service" data-motion="on">
  <head>
    <script>
      // Preserve older case-study links that used hash-based routing.
      if (/^#work\/[^/]+/.test(location.hash) || /^(sv|el)$/.test(new URLSearchParams(location.search).get("lang") || "")) {
        location.replace("./legacy/" + location.search + location.hash);
      }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3f1eb" />
    <meta
      name="description"
      content="Ioannis Koupidis | founder and Product Management student in Stockholm. Selected work across product discovery, UX research and independent software projects."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ioannis Koupidis | Product Management" />
    <meta
      property="og:description"
      content="I build for people, not assumptions. Founder turned product thinker."
    />
    <title>Ioannis Koupidis | Product Management</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="page-type" content="service" />
    <meta name="site-kind" content="other" />
    <link rel="stylesheet" href="./assets/taste-motion/motion.css" />
    <script>
      document.documentElement.classList.add("m-enter");
      setTimeout(
        () => document.documentElement.classList.add("m-enter-done"),
        700,
      );
    </script>
  </head>
  <body data-page="home" data-root="./">
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
